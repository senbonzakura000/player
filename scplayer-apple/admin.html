    <title>Stream Player</title>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow,noarchive,notranslate,noimageindex,nosnippet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/gh/senbonzakura000/popa/popa_pande_amazon.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/senbonzakura000/jambalaya/bootstrap.min.js"></script>

    <style>

        @font-face {
            font-family: "icons";
            src: url("fonts/FontAwesome.otf");
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            position: relative;
        }

        #player {
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }


        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 50;
        }

        #loading-overlay.hidden {
            display: none;
        }

        .spinner.wave-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            height: 48px;
            flex: 0 0 auto;
            margin: 0 auto 12px;
        }
        .spinner span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            animation: dot-wave 1.2s ease-in-out infinite;
        }
        .spinner span:nth-child(1) { animation-delay: -1.2s; }
        .spinner span:nth-child(2) { animation-delay: -1.08s; }
        .spinner span:nth-child(3) { animation-delay: -.96s; }
        .spinner span:nth-child(4) { animation-delay: -.84s; }
        .spinner span:nth-child(5) { animation-delay: -.72s; }
        @keyframes dot-wave {
            0%, 60%, 100% { transform: translateY(0); opacity: .4; }
            30% { transform: translateY(-12px); opacity: 1; }
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(100%, 520px);
            color: white;
            text-align: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #loading-message {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        @media (max-width: 720px) {
            #loading-overlay {
                padding: 1rem;
            }

            .loading-content {
                max-width: min(280px, calc(100vw - 32px));
            }

            #loading-message {
                font-size: 14px;
                line-height: 1.35;
            }

            .status-icon,
            .status-icon svg {
                width: 42px;
                height: 42px;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            .spinner.wave-dots span { animation: none; opacity: .8; }
        }

        /* Bitmovin watermark hide */
        button.bmpui-ui-watermark {
            display: none !important;
        }

        .bmpui-ui-watermark {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        .bmpui-ui-state-fullscreen button.bmpui-ui-watermark,
        .bmpui-fullscreen button.bmpui-ui-watermark {
            display: none !important;
        }

    </style>
</head>

<body>
    <div id="player"></div>

    <div id="loading-overlay" class="hidden">
        <div class="loading-content" role="status">
            <div class="spinner wave-dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
            <p id="loading-message"></p>
        </div>
    </div>
